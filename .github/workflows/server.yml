name: Server

on:
  push:
    paths: ["server/**", "shared/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", "shared/**", ".github/workflows/server.yml"]
  workflow_dispatch:

jobs:
  test:
    name: API tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20", "22"]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      - run: npm test
