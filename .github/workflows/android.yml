name: Android

on:
  push:
    paths: ["android/**", "shared/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "shared/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write # to publish the APK as a "latest-debug" pre-release

jobs:
  build:
    name: Unit tests + debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Files uploaded through the GitHub website lose the executable bit.
      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: inama-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: android/app/build/reports/tests/

      # A direct download link for phones and tablets (no zip to extract):
      # https://github.com/<owner>/<repo>/releases/download/latest-debug/inama-debug.apk
      - name: Publish APK as the "latest-debug" pre-release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk inama-debug.apk
          gh release delete latest-debug --yes --cleanup-tag || true
          gh release create latest-debug inama-debug.apk --prerelease --target "$GITHUB_SHA" \
            --title "Inama debug build" --notes "Debug build of ${GITHUB_SHA::7}. Install on Android 8.0+ (allow installs from your browser)."
