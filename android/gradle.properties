org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---- Inama build settings (override with -P on the command line or in ~/.gradle/gradle.properties)
# Inama API base URL. 10.0.2.2 is the host machine as seen from the Android emulator.
inama.apiBaseUrl=http://10.0.2.2:5055/api/v1
# Code accepted for sign-in when the server can't be reached (offline demo only).
inama.offlineDemoCode=123456
# Farmer helpline shown in Help (placeholder until a real number is assigned).
inama.helpline=+250 788 000 000
